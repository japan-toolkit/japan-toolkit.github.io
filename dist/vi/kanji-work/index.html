const N=10;
let lang="vi", set="safety", mode="meaning", round=null, best={};
lang=window.__LANG;
try{best=JSON.parse(localStorage.getItem("kjw-best"))||{};}catch(e){best={};}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=(s,o)=>s.replace("{n}",o.n).replace("{t}",o.t);

function newRound(){
  const words=shuffle(WORDS[set]).slice(0,N);
  round={qs:words.map(w=>({w,opts:shuffle([w,...shuffle(WORDS[set].filter(x=>x!==w)).slice(0,3)])})),i:0,score:0,missed:[],answered:false};
}
function answerText(w){ return mode==="reading"?w[1]:w[2][lang]; }

function renderSetup(){
  const t=T[lang];
  $("l-set").textContent=t.lset; $("l-mode").textContent=t.lmode; $("start").textContent=t.start;
  $("sets").innerHTML=Object.keys(WORDS).map(k=>{const b=best[k+"-"+mode];return `<button type="button" data-set="${k}" aria-pressed="${set===k}">${esc(t.sets[k][0])}<small><span lang="ja">${t.sets[k][1]}</span>${b!=null?" · "+esc(fmt(t.best,{n:b,t:N})):""}</small></button>`;}).join("");
  $("modes").innerHTML=Object.keys(t.modes).map(k=>`<button type="button" data-mode="${k}" aria-pressed="${mode===k}">${esc(t.modes[k][0])}<small>${esc(t.modes[k][1])}</small></button>`).join("");
}
function renderQuiz(){
  const t=T[lang], q=$("quiz");
  if(!round){q.hidden=true;$("setup").hidden=false;return;}
  q.hidden=false; $("setup").hidden=true;
  if(round.i>=round.qs.length){
    const missed=round.missed.map(w=>`<li><span class="k" lang="ja">${esc(w[0])}</span><span class="r" lang="ja">${esc(w[1])}</span><span>${esc(w[2][lang])}</span></li>`).join("");
    q.innerHTML=`<div class="eyebrow ask">${esc(t.result)}</div><div class="score">${round.score} / ${round.qs.length}</div>
      ${round.missed.length?`<div class="q">${esc(t.missed)}</div><ul class="review">${missed}</ul>`:`<p class="ask">${esc(t.perfect)}</p>`}
      <button type="button" class="btn primary" data-act="again">${esc(t.again)}</button><button type="button" class="btn" data-act="change">${esc(t.change)}</button>`;
    q.querySelector('[data-act="again"]').focus();
    return;
  }
  const {w,opts}=round.qs[round.i];
  let fb="";
  if(round.answered){
    const ok=round.lastOk;
    fb=`<div class="fb ${ok?"ok":"ng"}"><b>${esc(ok?t.right:t.wrong)}</b><span class="jp" lang="ja">${esc(w[0])}（${esc(w[1])}）</span> — ${esc(w[2][lang])}</div>
      <button type="button" class="btn primary" data-act="next">${esc(round.i+1<round.qs.length?t.next:t.finish)}</button>`;
  }
  q.innerHTML=`<div class="bar"><span>${esc(fmt(t.of,{n:round.i+1,t:round.qs.length}))}</span><span>${round.score} ✓</span></div>
    <div class="kanji" lang="ja">${esc(w[0])}</div><p class="ask">${esc(mode==="reading"?t.askR:t.askM)}</p>
    <div class="opts">${opts.map((o,i)=>{let c=mode==="reading"?"jp":"";if(round.answered){if(o===w)c+=" right";else if(o===round.pick)c+=" wrong";}
      return `<button type="button" class="${c}" data-opt="${i}"${mode==="reading"?' lang="ja"':""}${round.answered?" disabled":""}>${esc(answerText(o))}</button>`;}).join("")}</div>${fb}`;
  if(round.answered) q.querySelector('[data-act="next"]').focus();
}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang; $("lang").value=lang;
  $("title").textContent=t.title; $("lede").textContent=t.lede; $("note").textContent=t.note;
  renderSetup(); renderQuiz();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.set){set=b.dataset.set;renderSetup();return;}
  if(b.dataset.mode){mode=b.dataset.mode;renderSetup();return;}
  if(b.id==="start"){newRound();renderQuiz();return;}
  if(b.dataset.opt!=null&&round&&!round.answered){
    const q=round.qs[round.i], pick=q.opts[+b.dataset.opt], ok=pick===q.w;
    round.answered=true; round.lastOk=ok; round.pick=pick; if(ok) round.score++; else round.missed.push(q.w);
    renderQuiz(); return;
  }
  if(b.dataset.act==="next"){round.i++;round.answered=false;
    if(round.i>=round.qs.length){const k=set+"-"+mode;best[k]=Math.max(best[k]||0,round.score);try{localStorage.setItem("kjw-best",JSON.stringify(best))}catch(_){}}
    renderQuiz();return;}
  if(b.dataset.act==="again"){newRound();renderQuiz();return;}
  if(b.dataset.act==="change"){round=null;renderSetup();renderQuiz();$("start").focus();return;}
});
$("lang").addEventListener("change",e=>{location.href="../../"+e.target.value+"/kanji-work/";return;lang=e.target.value;try{localStorage.setItem("kjw-lang",lang)}catch(_){}render();});
render();
</script>
