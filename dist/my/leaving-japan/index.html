en:{title:"Things to do before you leave Japan",lede:"Once you decide to go home, work through these steps in order. Your checks are saved on this device.",phases:["1 month before","2 weeks before","The day before and the day you leave","After you get home"],progress:"{n} of {t} done",reset:"Clear all checks",crime:"Illegal",note:"Procedures can differ by city and employer. If you are unsure, ask your city office or your company.",items:[

["Close your bank account","Do this after your last salary and deposit refund arrive. Selling or giving your account to someone else is illegal."],
["Return health insurance documents","Follow your company's instructions (company insurance) or the city office's (National Health Insurance)."],
["Return your residence card at the airport","If you don't plan to come back, hand in your residence card (在留カード) at departure immigration."],
["Claim your pension refund within 2 years","Check the estimated amount with the nenkin calculator before you apply."],
["Get back the withheld tax","After you receive the pension refund, your tax representative files a tax return for you. The deadline is 5 years."]]},

let lang="vi", done=new Array(12).fill(false);
lang=window.__LANG;
try{const d=JSON.parse(localStorage.getItem("ljc-done")); if(Array.isArray(d)&&d.length===12) done=d;}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem("ljc-done",JSON.stringify(done));localStorage.setItem("ljc-lang",lang);}catch(e){}};

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  $("lang").value=lang;
  $("title").textContent=t.title; $("lede").textContent=t.lede;
  $("reset").textContent=t.reset; $("note").textContent=t.note;
  const n=done.filter(Boolean).length;
  $("count").textContent=t.progress.replace("{n}",n).replace("{t}",12);
  $("fill").style.width=(n/12*100)+"%";
  let html="";
  t.phases.forEach((ph,p)=>{
    html+=`<section class="phase"><h2>${ph}</h2>`;
    t.items.forEach((it,i)=>{
      if(PHASE[i]!==p) return;
      const tag=CRIME.includes(i)?`<span class="tag">${t.crime}</span>`:"";
      html+=`<label class="item${done[i]?" done":""}" for="s${i}"><input type="checkbox" id="s${i}" data-i="${i}"${done[i]?" checked":""}><span><b>${it[0]}${tag}</b><p>${it[1]}</p></span></label>`;
    });
    html+=`</section>`;
  });
  $("list").innerHTML=html;
}
$("list").addEventListener("change",e=>{const i=+e.target.dataset.i;done[i]=e.target.checked;save();render();document.getElementById("s"+i).focus();});
$("lang").addEventListener("change",e=>{location.href="../../"+e.target.value+"/leaving-japan/";return;lang=e.target.value;save();render();});
$("reset").addEventListener("click",()=>{done=done.map(()=>false);save();render();});
render();
</script>
