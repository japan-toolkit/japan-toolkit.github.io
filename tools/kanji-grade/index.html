<title>Primary-School Kanji Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Sans+JP:wght@400;600;700&display=swap">
<style>
/* Layout: grade + mode chooser, one question card at a time, then a review list. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14231f; --muted:#5a6b66; --line:#d7dfdc;
  --accent:#0f6b5c; --accent-soft:#dcefea; --seal:#b5532f; --seal-soft:#f6e6de; --ok:#2f7d4a; --ok-soft:#e1f1e6;
  --display:"Bricolage Grotesque","Be Vietnam Pro","Noto Sans Devanagari","Noto Sans Myanmar","Noto Sans JP",system-ui,sans-serif;
  --body:"Be Vietnam Pro","Noto Sans Devanagari","Noto Sans Myanmar","Noto Sans JP",system-ui,sans-serif;
  --jp:"Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --ink:#e4ece9; --muted:#9aaba6; --line:#2a3a36;
  --accent:#5cc4ae; --accent-soft:#1d3631; --seal:#e08a66; --seal-soft:#3a251d; --ok:#7fcf98; --ok-soft:#1c3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#e4ece9; --muted:#9aaba6; --line:#2a3a36;
  --accent:#5cc4ae; --accent-soft:#1d3631; --seal:#e08a66; --seal-soft:#3a251d; --ok:#7fcf98; --ok-soft:#1c3324; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
html:lang(my) body{line-height:1.95} html:lang(ne) body{line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px;color:var(--muted)}
select{font:500 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;max-width:100%}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.2;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.q{font-weight:600;font-size:14px;margin-bottom:8px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.chips button,.opts button,.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:600 14px var(--body);cursor:pointer;text-align:left;line-height:1.35}
.chips button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.card .btn{text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);text-align:center;font-size:15px;padding:12px}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.kanji{font:700 clamp(40px,12vw,64px)/1.2 var(--jp);text-align:center;padding:10px 0;overflow-wrap:anywhere}
.ask{text-align:center;color:var(--muted);font-size:14px;margin:0}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts button{font-size:16px;padding:12px 14px}
.opts button.jp{font-family:var(--jp)}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.opts button.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opts button:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:10px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--seal-soft)}
.fb b{display:block;font-size:15px}
.fb .jp{font-family:var(--jp)}
.score{font:700 clamp(34px,8vw,48px)/1 var(--display);color:var(--accent);text-align:center}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.review li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.review .k{font:700 20px var(--jp);grid-row:1/3}
.review .r{font-size:13px;color:var(--muted)}
.grades{grid-template-columns:repeat(3,minmax(0,1fr))}
.kanji.big1{font-size:clamp(64px,20vw,96px)}
.foot a{color:var(--accent)}
.best{font-size:12.5px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
</style>

  </div>
</div>

start:"စတင်ရန်",next:"နောက်မေးခွန်း",finish:"ရလဒ် ကြည့်ရန်",again:"ထပ်လုပ်ရန်",change:"အတန်း ပြောင်းရန်",askR:"ဤခန်းဂျီး၏ အသံထွက်တစ်ခုမှာ ဘယ်ဟာလဲ။",askM:"ဤခန်းဂျီး၏ အဓိပ္ပာယ်မှာ ဘာလဲ။ (အင်္ဂလိပ်)",askV:"",

note:"ရမှတ်နှင့် သင်မှားဖြေခဲ့သော ခန်းဂျီးများကို သင့်ဖုန်း သို့မဟုတ် ကွန်ပျူတာ၏ ဘရောက်ဇာတွင်သာ သိမ်းပါသည်။",retry:"မှားဖြေခဲ့သော ခန်းဂျီးများကို ထပ်လေ့ကျင့်ပါ",review:"မှားဖြေခဲ့သော ခန်းဂျီးများကို ပြန်လေ့လာပါ ({n} လုံး)"},

note:"記録とまちがえた漢字は、この端末の中だけに保存されます。",retry:"まちがえた漢字だけもう一度",review:"まちがえた漢字を復習（{n}字）"}

const N=10;
let lang="vi", grade=1, mode="reading", round=null, best={}, miss={};
try{const s=localStorage.getItem("kjg-lang"); if(T[s]) lang=s;}catch(e){}
try{best=JSON.parse(localStorage.getItem("kjg-best"))||{};}catch(e){best={};}
try{miss=JSON.parse(localStorage.getItem("kjg-miss"))||{};}catch(e){miss={};}
// Missed kanji per grade+mode, kept on this device only. A kanji leaves the list once answered correctly.
const missKey=()=>grade+"-"+mode;
const missList=()=>(miss[missKey()]||[]).map(k=>KANJI.find(r=>r[0]===k&&r[1]===grade)).filter(Boolean);
function saveMiss(k,m,ok){const key=grade+"-"+m,l=(miss[key]||[]).filter(x=>x!==k);if(!ok)l.push(k);if(l.length)miss[key]=l;else delete miss[key];try{localStorage.setItem("kjg-miss",JSON.stringify(miss))}catch(_){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(s,o)=>s.replace("{n}",o.n).replace("{t}",o.t).replace("{g}",o.g);
const COUNTS=[1,2,3,4,5,6].map(g=>KANJI.filter(r=>r[1]===g).length);

function renderSetup(){
  const t=T[lang]; if(!t.modes[mode]) mode="reading";
  $("l-set").textContent=t.lset; $("l-mode").textContent=t.lmode; $("start").textContent=t.start;
  $("sets").innerHTML=[1,2,3,4,5,6].map(g=>{const b=best[g+"-"+mode];return `<button type="button" data-grade="${g}" aria-pressed="${grade===g}">${esc(fmt(t.grade,{g}))}<small>${esc(fmt(t.count,{n:COUNTS[g-1]}))}${b!=null?" · "+b+"/"+N:""}</small></button>`;}).join("");
  const ml=missList(); $("review").hidden=!ml.length; $("review").textContent=fmt(t.review,{n:ml.length});
  $("modes").innerHTML=Object.keys(t.modes).map(k=>`<button type="button" data-mode="${k}" aria-pressed="${mode===k}">${esc(t.modes[k][0])}<small>${esc(t.modes[k][1])}</small></button>`).join("");
}
function detail(row){
  const t=T[lang];
  return `<span lang="ja">${esc(t.on)}: ${esc(row[3].join("、")||"—")} / ${esc(t.kun)}: ${esc(row[4].map(showReading).join("、")||"—")}</span><br><span>${esc(showMeaning(row))}</span>${lang==="vi"?` · <span>${esc(showViet(row))}</span>`:""} · <span>${esc(fmt(t.strokes,{n:row[2]}))}</span>`;
}
function renderQuiz(){
  const t=T[lang], q=$("quiz");
  if(!round){q.hidden=true;$("setup").hidden=false;return;}
  q.hidden=false; $("setup").hidden=true;
  if(round.i>=round.qs.length){
    const missed=round.missed.map(r=>`<li><span class="k" lang="ja">${esc(r[0])}</span><span class="r">${detail(r)}</span></li>`).join("");
    q.innerHTML=`<div class="ask">${esc(t.result)}</div><div class="score">${round.score} / ${round.qs.length}</div>
      ${round.missed.length?`<div class="q">${esc(t.missed)}</div><ul class="review">${missed}</ul>`:`<p class="ask">${esc(t.perfect)}</p>`}
      ${round.missed.length?`<button type="button" class="btn primary" data-act="retry">${esc(t.retry)}</button>`:""}<button type="button" class="btn${round.missed.length?"":" primary"}" data-act="again">${esc(t.again)}</button><button type="button" class="btn" data-act="change">${esc(t.change)}</button>`;
    q.querySelector('[data-act="retry"],[data-act="again"]').focus(); return;
  }
  const qq=round.qs[round.i], row=qq.row, jp=round.mode==="reading";
  let fb="";
  if(round.answered){
    fb=`<div class="fb ${round.lastOk?"ok":"ng"}"><b>${esc(round.lastOk?t.right:t.wrong)}</b>${detail(row)}</div>
      <button type="button" class="btn primary" data-act="next">${esc(round.i+1<round.qs.length?t.next:t.finish)}</button>`;
  }
  const ask=round.mode==="reading"?t.askR:round.mode==="viet"?t.askV:t.askM;
  q.innerHTML=`<div class="bar"><span>${esc(fmt(t.of,{n:round.i+1,t:round.qs.length}))}</span><span>${round.score} ✓</span></div>
    <div class="kanji big1" lang="ja">${esc(row[0])}</div><p class="ask">${esc(ask)}</p>
    <div class="opts">${qq.options.map((o,i)=>{let c=jp?"jp":"";if(round.answered){if(o===qq.answer)c+=" right";else if(o===round.pick)c+=" wrong";}
      return `<button type="button" class="${c}" data-opt="${i}"${jp?' lang="ja"':(round.mode==="meaning"?' lang="en"':"")}${round.answered?" disabled":""}>${esc(o)}</button>`;}).join("")}</div>${fb}`;
  if(round.answered) q.querySelector('[data-act="next"]').focus();
}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang; $("lang").value=lang;
  $("title").textContent=t.title; $("lede").textContent=t.lede; $("note").textContent=t.note;
  $("ver").textContent="(KANJIDIC2 "+KANJIDIC_VERSION.database_version+", "+KANJIDIC_VERSION.date_of_creation+")";
  renderSetup(); renderQuiz();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.grade){grade=+b.dataset.grade;renderSetup();return;}
  if(b.dataset.mode){mode=b.dataset.mode;renderSetup();return;}
  if(b.id==="start"||b.dataset.act==="again"){round={qs:makeRound(grade,mode,N),i:0,score:0,missed:[],answered:false,mode,full:true};renderQuiz();return;}
  if(b.id==="review"||b.dataset.act==="retry"){const rows=b.id==="review"?missList():round.missed, m=b.id==="review"?mode:round.mode;round={qs:makeRoundFrom(rows,grade,m,N),i:0,score:0,missed:[],answered:false,mode:m,full:false};renderQuiz();return;}
  if(b.dataset.opt!=null&&round&&!round.answered){
    const q=round.qs[round.i], pick=q.options[+b.dataset.opt], ok=pick===q.answer;
    round.answered=true; round.lastOk=ok; round.pick=pick; if(ok) round.score++; else round.missed.push(q.row); saveMiss(q.row[0],round.mode,ok);
    renderQuiz(); return;
  }
  if(b.dataset.act==="next"){round.i++;round.answered=false;
    if(round.i>=round.qs.length&&round.full){const k=grade+"-"+round.mode;best[k]=Math.max(best[k]||0,round.score);try{localStorage.setItem("kjg-best",JSON.stringify(best))}catch(_){}}
    renderQuiz();return;}
  if(b.dataset.act==="change"){round=null;renderSetup();renderQuiz();$("start").focus();return;}
});
$("lang").addEventListener("change",e=>{lang=e.target.value;try{localStorage.setItem("kjg-lang",lang)}catch(_){}render();});
render();
</script>
