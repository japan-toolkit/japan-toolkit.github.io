<style>
/* Layout: inputs card, then a big take-home figure and the deduction lines, each keyed by its Japanese term as on a pay slip. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14231f; --muted:#5a6b66; --line:#d7dfdc;
  --accent:#0f6b5c; --accent-soft:#dcefea; --seal:#b5532f; --seal-soft:#f6e6de;
  --display:"Bricolage Grotesque","Be Vietnam Pro","Noto Sans Devanagari","Noto Sans Myanmar","Noto Sans JP",system-ui,sans-serif;
  --body:"Be Vietnam Pro","Noto Sans Devanagari","Noto Sans Myanmar","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --jp:"Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --ink:#e4ece9; --muted:#9aaba6; --line:#2a3a36;
  --accent:#5cc4ae; --accent-soft:#1d3631; --seal:#e08a66; --seal-soft:#3a251d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#e4ece9; --muted:#9aaba6; --line:#2a3a36;
  --accent:#5cc4ae; --accent-soft:#1d3631; --seal:#e08a66; --seal-soft:#3a251d; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
html:lang(my) body{line-height:1.95} html:lang(ne) body{line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px;color:var(--muted)}
select{font:500 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;max-width:100%}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.2;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:560px){.panel{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px;min-width:0}
label .hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=number]{font:500 16px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.panel select{border-radius:10px;padding:10px 12px;font-size:15px;background:var(--bg);width:100%}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.year{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.year button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:600 14px var(--body);cursor:pointer}
.year button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font:600 clamp(34px,7vw,48px)/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line .jp{font:600 13px var(--jp);color:var(--muted)}
.line .amt{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.line.neg .amt{color:var(--seal)}
.line.total{font-weight:600}
.notes{font-size:13.5px;color:var(--muted);margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.foot a{color:var(--accent)}
</style>

      <a href="https://www.mhlw.go.jp/content/001672589.pdf" target="_blank" rel="noopener">厚生労働省 雇用保険料率</a></span>

  </div>
</div>

let lang="vi", year=Math.min(2027,Math.max(2026,new Date().getFullYear()));
try{const s=localStorage.getItem("thc-lang"); if(T[s]) lang=s;}catch(e){}
const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(n).toLocaleString("en-US");
const num=id=>Math.max(0,Math.floor(+$(id).value||0));

function fillSelects(){
  const t=T[lang], pv=$("pref").value||"東京", dv=$("deps").value||"0";
  $("pref").innerHTML=Object.keys(HEALTH_RATE_FY2026).map(p=>`<option value="${p}">${lang==="ja"?p:PREF_EN[p]+" "+p} (${HEALTH_RATE_FY2026[p].toFixed(2)}%)</option>`).join("");
  $("pref").value=pv;
  $("deps").innerHTML=[0,1,2,3,4,5,6,7].map(n=>`<option value="${n}">${n}</option>`).join("");
  $("deps").value=dv;
}
function calc(){
  const t=T[lang], pay=num("pay"), commute=Math.min(num("commute"),pay), jumin=num("jumin");
  const over40=$("age40").checked, deps=+$("deps").value, pref=$("pref").value;
  const ins=premiums(pay,{healthRate:HEALTH_RATE_FY2026[pref]/100,age40to64:over40});
  const A=Math.max(0,pay-commute-ins.total);           // 社会保険料等控除後の給与等の金額
  const tax=pay>0?withholdingKou(A,deps,year):0;
  const total=ins.total+tax+jumin, net=pay-total;
  $("v-net").textContent=pay>0?yen(net):"—";
  const L=[["gross","総支給額",pay,""],["health","健康保険"+(over40?"・介護保険":""),-ins.health,over40?t.kaigo:""],["kodomo","子ども・子育て支援金",-ins.kodomo,""],
    ["pension","厚生年金",-ins.pension,""],["koyo","雇用保険",-ins.koyo,""],["shotoku","所得税",-tax,""],["juminL","住民税",-jumin,""],["total","控除合計",-total,""]];
  $("lines").innerHTML=L.map(([k,jp,v,extra])=>`<div class="line${(k!=="gross"&&v!==0)||k==="total"?" neg":""}${k==="total"?" total":""}"><span>${t[k]} ${extra}</span><span class="jp" lang="ja">${jp}</span><span class="amt">${k!=="gross"&&v!==0?"−"+yen(-v):yen(Math.abs(v))}</span></div>`).join("");
}
function render(){
  const t=T[lang];
  document.documentElement.lang=lang; $("lang").value=lang;
  $("title").textContent=t.title; $("lede").textContent=t.lede;
  for(const [id,k] of [["l-pay","pay"],["h-pay","hPay"],["l-commute","commute"],["h-commute","hCommute"],["l-pref","pref"],["h-pref","hPref"],["l-deps","deps"],["h-deps","hDeps"],["l-jumin","jumin"],["h-jumin","hJumin"],["l-age","age"],["l-year","year"],["l-net","net"],["l-source","source"],["checked","checked"]]) $(id).textContent=t[k];
  $("y2026").textContent="2026"; $("y2027").textContent="2027";
  $("notes").innerHTML=t.notes.map(n=>`<li>${n}</li>`).join("");
  fillSelects(); setYear(year);
}
function setYear(y){ year=y; document.querySelectorAll(".year button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.y===y))); calc(); }
document.querySelectorAll(".year button").forEach(b=>b.addEventListener("click",()=>setYear(+b.dataset.y)));
["pay","commute","jumin"].forEach(id=>$(id).addEventListener("input",calc));
["pref","deps","age40"].forEach(id=>$(id).addEventListener("change",calc));
$("lang").addEventListener("change",e=>{lang=e.target.value;try{localStorage.setItem("thc-lang",lang)}catch(_){}render();});
render();
</script>
